<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>AeroGuard on Cardano: agents pay per request via x402 for Airnode-signed flight verdicts that the Aiken cover and FlightDelayCover verify</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="450" fill="#ffffff"/>

  <!-- Agent -->
  <rect x="20" y="40" width="200" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="120" y="66" text-anchor="middle" font-weight="700">AI agent</text>
  <text x="120" y="88" text-anchor="middle">claims agent · MCP tool · buy</text>
  <text x="120" y="108" text-anchor="middle">preprod wallet (mnemonic)</text>
  <text x="120" y="128" text-anchor="middle">spend cap: tADA, ≤ 5 / request</text>
  <text x="120" y="148" text-anchor="middle">budget per run</text>

  <!-- Server -->
  <rect x="390" y="40" width="230" height="140" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="505" y="66" text-anchor="middle" font-weight="700">AeroGuard x402 server</text>
  <text x="505" y="88" text-anchor="middle">GET /verdict?flight=&amp;date=</text>
  <text x="505" y="108" text-anchor="middle">@x402/express · exact scheme</text>
  <text x="505" y="128" text-anchor="middle">1 tADA live · 2 tADA final</text>
  <text x="505" y="148" text-anchor="middle">GET /policy: tADA → Base policy</text>
  <text x="505" y="168" text-anchor="middle">free: /flights /orders /.well-known</text>

  <!-- Facilitator / chain -->
  <rect x="760" y="40" width="200" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="860" y="66" text-anchor="middle" font-weight="700">Cardano preprod</text>
  <text x="860" y="88" text-anchor="middle">facilitator (in-process,</text>
  <text x="860" y="108" text-anchor="middle">no keys) verifies, submits</text>
  <text x="860" y="128" text-anchor="middle">via Blockfrost</text>
  <text x="860" y="148" text-anchor="middle">receipt on Cardanoscan</text>

  <!-- arrows top row -->
  <line x1="222" y1="70" x2="386" y2="70" stroke="#334155" marker-end="url(#a)"/>
  <text x="304" y="62" text-anchor="middle" font-size="12">① GET → 402 offer</text>
  <line x1="222" y1="100" x2="386" y2="100" stroke="#334155" marker-end="url(#a)"/>
  <text x="304" y="94" text-anchor="middle" font-size="12">② signed tx, retry</text>
  <line x1="386" y1="132" x2="222" y2="132" stroke="#334155" marker-end="url(#a)"/>
  <text x="304" y="126" text-anchor="middle" font-size="12">⑤ verdict + signed proof</text>
  <line x1="622" y1="85" x2="756" y2="85" stroke="#334155" marker-end="url(#a)"/>
  <text x="689" y="78" text-anchor="middle" font-size="12">③ verify · submit</text>
  <line x1="756" y1="120" x2="622" y2="120" stroke="#334155" marker-end="url(#a)"/>
  <text x="689" y="138" text-anchor="middle" font-size="12">④ confirmed tx</text>

  <!-- Evidence -->
  <rect x="390" y="230" width="230" height="90" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="505" y="256" text-anchor="middle" font-weight="700">Signed evidence (disk only)</text>
  <text x="505" y="278" text-anchor="middle">AeroDataBox Airnode 0x83FE…F2Ec</text>
  <text x="505" y="298" text-anchor="middle">bought once by our keeper (x402, Base)</text>
  <line x1="505" y1="228" x2="505" y2="183" stroke="#334155" marker-end="url(#a)"/>
  <text x="512" y="210" font-size="12">never calls AeroDataBox (shared quota)</text>

  <!-- Verifiers -->
  <rect x="20" y="230" width="300" height="180" rx="10" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="170" y="256" text-anchor="middle" font-weight="700">Any contract verifies the same proof</text>
  <text x="34" y="282">Cardano: Aiken flight_cover (Plutus V3)</text>
  <text x="44" y="302" font-size="12">keccak_256 + verifyEcdsaSecp256k1Signature</text>
  <text x="44" y="320" font-size="12">payout ≥180 min / cancel: full · ≥120: half</text>
  <text x="44" y="338" font-size="12">tagged outputs (no double satisfaction)</text>
  <text x="34" y="364">Base Sepolia: FlightDelayCover.sol</text>
  <text x="44" y="400" font-size="12">cardanoJobRef = keccak("cardano:&lt;tx&gt;")</text>
  <text x="44" y="384" font-size="12">ecrecover · same request · same rule</text>
  <line x1="120" y1="163" x2="120" y2="226" stroke="#334155" marker-end="url(#a)"/>
  <text x="128" y="200" font-size="12">⑥ settle with the bought proof</text>

  <!-- Anchor -->
  <rect x="680" y="230" width="280" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="820" y="256" text-anchor="middle" font-weight="700">Optional anchor (ANCHOR=true)</text>
  <text x="820" y="278" text-anchor="middle">seller writes the sold proof into</text>
  <text x="820" y="298" text-anchor="middle">Cardano tx metadata (labels 674, 8402)</text>
  <line x1="860" y1="163" x2="860" y2="226" stroke="#334155" marker-end="url(#a)"/>

  <text x="490" y="438" text-anchor="middle" font-size="12" fill="#475569">Agents pay per request on Cardano for flight outcomes any contract can verify.</text>
</svg>
