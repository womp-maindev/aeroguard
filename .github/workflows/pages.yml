name: Dashboard on GitHub Pages
# puts web/ on github pages. the page reads the chain itself + the keeper log from keeper-data, no api needed.
# setup once: settings → pages → source: github actions
# manual for now bc the repo is private. when public, run it from actions or add back:
#   push: { branches: [main], paths: ["web/**", ".github/workflows/pages.yml"] }

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
