name: Dashboard on GitHub Pages
# puts web/ on github pages. the page reads the chain itself + the keeper log from keeper-data, no api needed.
# setup once: settings → pages → source: github actions
# redeploys on every web/ change and after every keeper run (fresh keeper.json snapshot baked in).
# while the repo is private pages can't work on this plan, so automatic runs skip themselves.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["AeroGuard keeper"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: bake in the latest keeper.json
        run: |
          git fetch -q --depth=1 origin keeper-data && git show FETCH_HEAD:keeper.json > web/data/keeper.json || echo "no keeper-data yet, keeping the committed snapshot"
          node .github/scripts/data-bundle.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
