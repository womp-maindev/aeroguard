name: Dashboard on GitHub Pages
# Publishes web/ as a static site. The page reads policies straight from Base Sepolia (eth_call to
# https://sepolia.base.org), the keeper log from the keeper-data branch, and needs no keeper API.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Manual only while the repo is private (Pages needs a public repo on this plan); the team uses the Cloudflare
# deployment behind Cloudflare Access meanwhile. Once public: run it from Actions, or add back
#   push: { branches: [main], paths: ["web/**", ".github/workflows/pages.yml"] }

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
