name: Record tamper lab video

# Opens the dashboard from main in a headless browser, runs the 4 attacks on policy #1 against
# the deployed FlightDelayCover (eth_call only, nothing is sent) and uploads the screen recording.
on:
  push:
    branches: [claude/bold-ride-xhu8s8]
    paths: [.github/workflows/record-tamper.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          mkdir -p /tmp/rec && cd /tmp/rec && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Record
        run: |
          (cd web && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          cat > /tmp/rec/rec.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport: { width: 1440, height: 900 }, recordVideo: { dir: '/tmp/out', size: { width: 1440, height: 900 } } });
            const p = await ctx.newPage();
            p.on('console', (m) => console.log('[page]', m.text()));
            await p.goto('http://localhost:8000/index.html');
            await p.waitForTimeout(3000);
            await p.waitForSelector('#tPolicy option[value="1"]', { state: 'attached', timeout: 90000 });
            await p.locator('#lab').scrollIntoViewIfNeeded();
            await p.waitForTimeout(1500);
            await p.selectOption('#tPolicy', '1');
            await p.waitForTimeout(1500);
            await p.click('#runAll');
            await p.waitForTimeout(20000);
            const g = p.getByRole('button', { name: /Simulate genuine/i });
            if (await g.count()) { await g.first().scrollIntoViewIfNeeded(); await g.first().click(); await p.waitForTimeout(12000); }
            await p.locator('#lab').screenshot({ path: '/tmp/out/tamper-lab-policy1.png' });
            console.log((await p.locator('#modes').innerText()).slice(0, 2000));
            await p.waitForTimeout(3000);
            await ctx.close();
            await b.close();
          })();
          JS
          mkdir -p /tmp/out && cd /tmp/rec && node rec.js
      - name: Convert to mp4 and commit to this branch
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          f=$(ls /tmp/out/*.webm | head -1)
          ffmpeg -y -loglevel error -i "$f" -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/out/tamper-lab-policy1.mp4
          git fetch -q origin claude/bold-ride-xhu8s8 && git checkout -q -B rec origin/claude/bold-ride-xhu8s8
          mkdir -p media && cp /tmp/out/tamper-lab-policy1.mp4 /tmp/out/tamper-lab-policy1.png media/
          git config user.name womp-maindev && git config user.email 226526968+womp-maindev@users.noreply.github.com
          git add media && git commit -qm "media: tamper lab recording on policy #1 (live contract, eth_call)" && git push -q origin rec:claude/bold-ride-xhu8s8
      - uses: actions/upload-artifact@v4
        with:
          name: tamper-lab-recording
          path: /tmp/out
