name: Voice the demo video

# Adds a Piper TTS voice-over (media/voiced/lines.tsv: start, slot seconds, text) to media/voiced/aeroguard-demo-draft.mp4
# and commits media/voiced/aeroguard-demo-voiced.mp4 to this branch.
on:
  push:
    branches: [claude/bold-ride-xhu8s8]
    paths: [media/voiced/*.tsv, .github/workflows/voice-video.yml]
  workflow_dispatch:
    inputs:
      voice_id:
        description: "ElevenLabs voice id (default: Adam)"
        default: "pNInz6obpgDQGcFmaJgB"

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Piper + ffmpeg
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          pip install -q piper-tts
          mkdir -p /tmp/v && cd /tmp/v
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          curl -sSL -o voice.onnx $base/en_US-ryan-high.onnx
          curl -sSL -o voice.onnx.json $base/en_US-ryan-high.onnx.json
      - name: Synthesize and mix
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id || 'pNInz6obpgDQGcFmaJgB' }}
        run: |
          set -e
          git fetch -q origin main
          git show origin/main:video/aeroguard-api3-full.mp4 > /tmp/v/api3.mp4 2>/dev/null || rm -f /tmp/v/api3.mp4
          git show origin/main:cardano/video/aeroguard-cardano-full.mp4 > /tmp/v/cardano.mp4 2>/dev/null || rm -f /tmp/v/cardano.mp4
          cp media/voiced/aeroguard-demo-draft.mp4 /tmp/v/demo.mp4
          voice() { # video lines out
            local vid=$1 tsv=$2 out=$3 i=0 inputs="" filters="" mix=""
            while IFS=$'\t' read -r start slot text; do
              [ -z "$start" ] && continue
              if [ -n "$ELEVENLABS_API_KEY" ]; then
                body=$(python3 -c "import json,sys;print(json.dumps({'text':sys.argv[1],'model_id':'eleven_multilingual_v2','voice_settings':{'stability':0.5,'similarity_boost':0.75,'style':0.2}}))" "$text")
                code=$(curl -sS -o /tmp/v/$out-$i.mp3 -w '%{http_code}' -X POST "https://api.elevenlabs.io/v1/text-to-speech/$VOICE_ID?output_format=mp3_44100_128" -H "xi-api-key: $ELEVENLABS_API_KEY" -H 'Content-Type: application/json' -d "$body")
                [ "$code" = "200" ] || { echo "ElevenLabs HTTP $code: $(head -c 300 /tmp/v/$out-$i.mp3)"; exit 1; }
                ffmpeg -y -loglevel error -i /tmp/v/$out-$i.mp3 /tmp/v/$out-$i.wav
              else
                echo "$text" | piper --model /tmp/v/voice.onnx --length_scale 0.95 --output_file /tmp/v/$out-$i.wav
              fi
              d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/v/$out-$i.wav)
              t=$(python3 -c "d=$d;s=$slot-0.25;print(max(1.0,min(1.35,d/s)))")
              ms=$(python3 -c "print(int(($start+0.15)*1000))")
              inputs="$inputs -i /tmp/v/$out-$i.wav"
              filters="$filters[$((i+1)):a]atempo=$t,adelay=${ms}|${ms}[a$i];"
              mix="$mix[a$i]"
              echo "$out line $i: ${d}s in ${slot}s, tempo $t"
              i=$((i+1))
            done < "$tsv"
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$vid")
            ffmpeg -y -loglevel error -f lavfi -t "$dur" -i anullsrc=r=22050:cl=mono $inputs -filter_complex "${filters}[0:a]${mix}amix=inputs=$((i+1)):duration=first:normalize=0,volume=1.6[aout]" -map "[aout]" -ar 44100 /tmp/v/$out.wav
            ffmpeg -y -loglevel error -i "$vid" -i /tmp/v/$out.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 160k -movflags +faststart media/voiced/$out.mp4
            ls -la media/voiced/$out.mp4
          }
          [ -s /tmp/v/api3.mp4 ] && voice /tmp/v/api3.mp4 media/voiced/api3-lines.tsv aeroguard-api3-voiced || echo "no API3 source on main"
          [ -s /tmp/v/cardano.mp4 ] && voice /tmp/v/cardano.mp4 media/voiced/cardano-lines.tsv aeroguard-cardano-voiced || echo "no Cardano source on main"
      - name: Commit
        run: |
          git config user.name womp-maindev && git config user.email 226526968+womp-maindev@users.noreply.github.com
          git add media/voiced/*.mp4 && git commit -qm "media: voiced videos (demo, API3, Cardano)${ELEVEN:+ — ElevenLabs}" && git push -q origin HEAD:claude/bold-ride-xhu8s8
