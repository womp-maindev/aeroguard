name: CI
# Offline checks only: no AeroDataBox calls (the quota is shared by every team), no keys, no testnet.

on:
  push:
    branches-ignore: [keeper-data] # data only, written by the keeper workflow
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: forge test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Tests (incl. the real AirnodeHub capture)
        working-directory: contracts
        run: forge test

  keeper:
    name: keeper typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  rehearsal:
    name: end-to-end rehearsal (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Install keeper
        working-directory: keeper
        run: npm ci
      - name: Deploy, buy 5 policies, 4 forgeries, keeper settles (fails on any mismatch)
        working-directory: keeper
        run: |
          anvil --chain-id 84532 > /dev/null &
          npm run rehearse
