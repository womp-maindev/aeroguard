name: Dashboard on Cloudflare Pages
# web/ → cloudflare pages on every push that touches it. main = aeroguard.pages.dev, other branches get previews.
# needs secrets CLOUDFLARE_API_TOKEN ("Cloudflare Pages: Edit") + CLOUDFLARE_ACCOUNT_ID, otherwise it just skips

on:
  push:
    paths: ["web/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: bake in the latest keeper.json
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: git fetch -q --depth=1 origin keeper-data && git show FETCH_HEAD:keeper.json > web/data/keeper.json || echo "no keeper-data yet, keeping the committed snapshot"
      - name: create the pages project (fine if it exists)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages project create aeroguard --production-branch main || true
      - name: Deploy web/
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy web --project-name aeroguard --branch "${GITHUB_REF_NAME}" --commit-hash "${GITHUB_SHA}" --commit-dirty=true
