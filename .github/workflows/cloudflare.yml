name: Dashboard on Cloudflare Pages
# Deploys web/ to Cloudflare Pages on every push that touches it: main → production
# (https://aeroguard.pages.dev), any other branch → its own preview URL (<branch>.aeroguard.pages.dev).
# Setup: repo secrets CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
# Without them the job is skipped.

on:
  push:
    paths: ["web/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Create the Pages project once (no-op when it exists)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages project create aeroguard --production-branch main || true
      - name: Deploy web/
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy web --project-name aeroguard --branch "${GITHUB_REF_NAME}" --commit-hash "${GITHUB_SHA}" --commit-dirty=true
