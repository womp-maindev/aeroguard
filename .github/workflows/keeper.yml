name: AeroGuard keeper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: keeper/.cache
          key: keeper-${{ github.run_id }}
          restore-keys: keeper-
      - name: Install
        working-directory: keeper
        run: npm ci
      - name: Keeper tick
        working-directory: keeper
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          FLIGHT_COVER_ADDRESS: "0x257054204c4Cd43846C4553eBe6D709841980a80"
          BASE_SEPOLIA_RPC: https://sepolia.base.org
        run: node src/cli.ts tick
